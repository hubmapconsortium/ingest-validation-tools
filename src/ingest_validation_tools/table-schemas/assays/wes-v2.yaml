fields:
- name: is_cedar
  description: 'Identifies whether the version is hosted by CEDAR'
  example: 'https://openview.metadatacenter.org/templates/https:%2F%2Frepo.metadatacenter.org%2Ftemplates%2F9a0570b7-b0ee-4e7e-a413-f95ae2f6cde7'
- name: assay_category
  constraints:
    enum:
      - sequence
- name: assay_type
  constraints:
    enum:
      - Whole Exome Sequencing (WES)
- name: parent_id
  description: "UUID or HuBMAP ID of parent"
  example: "ec2ccf5a3436b11d0c7186b74ad4673d"
  custom_constraints:
    url:
      prefix: "https://entity.api.hubmapconsortium.org/entities/"